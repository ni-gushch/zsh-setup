---
on: [push, pull_request, workflow_dispatch]

name: Lint

permissions: read-all

jobs:
  super-linter:
    runs-on: ubuntu-latest

    permissions:
      actions: read
      checks: read
      contents: read
      deployments: read
      issues: read
      discussions: read
      packages: read
      pages: read
      pull-requests: read
      repository-projects: read
      security-events: read
      # To report GitHub Actions status checks
      statuses: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Fix formatting with Prettier
        run: |
          npx prettier --write .github/workflows/lint.yml
          npx prettier --write .github/dependabot.yml
          npx prettier --write .github/linters/.markdown-lint.yml
          npx prettier --write .github/linters/zizmor.yaml

      - name: Lint Code Base
        uses: super-linter/super-linter@7bba2eeb89d01dc9bfd93c497477a57e72c83240
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VALIDATE_GITHUB_ACTIONS_ZIZMOR: false
